/* ---------- 1回分 ---------- */
function open(id){
  if(!inMihon(id)) return;
  cur=LESSONS.find(l=>l.id===id); streak=0; { const s0=stats(cur); wasDone=s0.done===s0.total; }
  const z=ZONES[cur.zone];
  document.documentElement.style.setProperty("--zc",`var(${z.c})`); document.documentElement.style.setProperty("--zct",`var(${z.t})`);
  app.innerHTML=`<div class="bar"><button class="back" id="bk">← もくじ</button><span class="ttl">第${cur.no}回　${R(cur.title)}</span><span class="streak" id="sk"></span><span class="sc" id="sc"></span></div>
  <div class="goal"><b>今日のゴール</b>　${R(cur.goal)}</div><div id="vr"></div>
  ${SUBMIT_URL?`<button type="button" class="sendnote" id="sn"><span class="tx">📮 最後まで解いたら、いちばん下の<b>「記録を送る」</b>を押してね</span><span class="ar">↓</span></button>`:""}<div id="secs"></div>`;
  warned=false;
  const vr=VIDEO.row(cur.id); if(vr) document.getElementById("vr").appendChild(vr);
  /* 前に確かめておきたい回へ（あやしいときだけ） */
  if(cur.back && inMihon(cur.back.to)){ const to=LESSONS.find(l=>l.id===cur.back.to); const d=el("div","vrow"); d.appendChild(el("span","vl","↩ あやしいときは：")); const b=el("button","vbtn back",`${cur.back.what} → 第${to.no}回`); b.type="button"; b.addEventListener("click",()=>{ if(remindSend()) return; open(to.id); }); d.appendChild(b); document.getElementById("vr").appendChild(d); }
  /* 見本の「もどり先」の回：もとの回へ帰る道 */
  if(isModori(cur.id)){ const fr=modoriFrom(cur.id); if(fr){ const d=el("div","modori-note"); d.innerHTML=`見本の「もどり先」の回。おわったら<b>第${fr.no}回</b>にもどろう。`; const b=el("button","vbtn",`→ 第${fr.no}回にもどる`); b.type="button"; b.addEventListener("click",()=>{ if(remindSend()) return; open(fr.id); }); d.appendChild(b); document.getElementById("vr").appendChild(d); } }
  document.getElementById("bk").addEventListener("click", ()=>{ if(remindSend()) return; home(); });
  const sn=document.getElementById("sn"); if(sn) sn.addEventListener("click", goSend);
  const box=document.getElementById("secs");
  cur.secs.forEach(sec=>{
    const d=el("section","sec");
    d.innerHTML=`<div class="sh"><span class="tag" style="--tg:var(${TAGC[sec.tag]||"--tg5"})">${sec.tag}</span><h2>${R(sec.title)}</h2></div>`;
    if(sec.tag==="ふり返り" && cur.no>0) d.appendChild(el("p","lscope", (VIDEO.backToL0(cur.id) && inMihon("L0")) ? "前に習ったことの確かめ。あやしいときは、まちがえたあとに出る「第0回へもどる」や動画で確かめよう。" : "前に習ったことの確かめ。あやしいときは、まちがえたあとに出る動画（はじめに、この内容のふり返りがある章）で確かめよう。"));
    sec.items.forEach(it=>{ const n=renderItem(it); if(n) d.appendChild(n); });
    box.appendChild(d);
  });
  box.appendChild(renderReflect());
  MEMO.enter(cur.id);
  updateScore(); window.scrollTo(0,0);
}

function fbSet(fb, ok, msg, hint){ fb.className="fb "+(ok?"ok":"ng"); fb.innerHTML=msg+(hint?`<span class="hint">ヒント：${R(hint)}</span>`:""); }
function showWhy(card, it){ if(it.why && !card.querySelector(".why")) card.appendChild(el("div","why",R(it.why))); }
const OK_MSG = "○ せいかい！", NG_MSG = "× ちがう。もう一度";
/* 2回まちがえたら：「答えを見る」と、動画・第0回・聞くことリストへの道 */
function revealBtn(card, it, onReveal){
  if(card.querySelector(".reveal")) return;
  const b=el("button","reveal","答えを見る"); b.type="button";
  b.addEventListener("click",()=>{ b.remove(); onReveal(); });
  card.appendChild(b);
  helpRow(card, it);
}
function helpRow(card, it){
  if(card.querySelector(".helprow")) return;
  const r=el("div","helprow");
  const n=VIDEO.forSec(cur.id, it.si);
  if(n){ const v=el("button","vbtn",`🎬 動画 第${n}章で確かめる`); v.type="button"; v.addEventListener("click",()=>VIDEO.open(n)); r.appendChild(v); }
  if(it.furi && cur.no>0 && VIDEO.backToL0(cur.id) && inMihon("L0")){ const g=el("button","vbtn back","↩ 第0回へもどる"); g.type="button"; g.addEventListener("click",()=>{ if(remindSend()) return; open("L0"); }); r.appendChild(g); }
  let km=null;
  if(QMODE==="b"){ const [kb, m]=KIKU.button(card,{src:it.id, no:cur.no, title:cur.title, kind:"問題", q:it.q}); r.appendChild(kb); km=m; }
  card.appendChild(r); if(km) card.appendChild(km);
}

function renderItem(it){
  const st=LS(cur.id);
  if(it.t==="info"){ const c=el("div","card info"+(it.cls?" "+it.cls:""),`<span class="k">${it.k}</span>${R(it.html)}`); return c; }
  if(it.t==="why"){
    const st0=LS(cur.id); st0.whyOpen=st0.whyOpen||{};
    const c=el("div","card whycard"); c.dataset.id=it.id;
    c.innerHTML=`<div class="wq">🤔 ${R(it.q)}</div>`;
    const body=el("div","wa",`<p>${R(it.a)}</p>${it.tr?`<div class="qc"><b>ためしてみよう</b>　${R(it.tr)}</div>`:""}`);
    const btn=el("button","go sub","30秒考えてから、開く"); btn.type="button";
    const show=()=>{ body.style.display="block"; btn.remove(); };
    btn.addEventListener("click",()=>{ show(); st0.whyOpen[it.id]=1; touch(); });
    body.style.display="none"; c.append(btn, body);
    if(st0.whyOpen[it.id]) show();
    return c;
  }
  if(it.t==="fig"){ const box=el("div"); try{ W[it.name](box, it.arg||{}); }catch(e){ box.textContent="（図を表示できませんでした）"; console.error(e); } return box; }
  const card=el("div","card"); card.dataset.id=it.id;
  const r=st.items[it.id];

  if(it.t==="choice"||it.t==="multi"){
    card.appendChild(el("div","q",R(it.q)));
    const ops=el("div","opts"), fb=el("div","fb"); const picked=new Set();
    const isRight=i=> it.t==="multi" ? it.ans.includes(i) : i===it.ans;
    const finish=(msg)=>{ ops.querySelectorAll(".opt").forEach((x,i)=>{ x.disabled=true; x.classList.remove("sel","wrong"); if(isRight(i)) x.classList.add("right"); }); const g=card.querySelector(".go"); if(g) g.remove(); fbSet(fb,true,msg); showWhy(card,it); };
    it.opts.forEach((o,i)=>{
      const b=el("button","opt",R(o)); b.type="button";
      b.addEventListener("click",()=>{
        if(it.t==="choice"){
          const ok=i===it.ans; const rr=mark(it.id, ok);
          ops.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong"));
          if(ok) finish(OK_MSG);
          else { b.classList.add("wrong"); fbSet(fb,false,NG_MSG, it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); finish("答え"); }); }
        } else { if(picked.has(i)){ picked.delete(i); b.classList.remove("sel"); } else { picked.add(i); b.classList.add("sel"); } }
      });
      ops.appendChild(b);
    });
    card.appendChild(ops);
    if(it.t==="multi"){
      const go=el("button","go","こたえる"); go.type="button";
      go.addEventListener("click",()=>{
        const ok=picked.size===it.ans.length && it.ans.every(a=>picked.has(a));
        const rr=mark(it.id, ok);
        if(ok) finish(OK_MSG);
        else { fbSet(fb,false, picked.size<it.ans.length?"× ちがう。もう一度（まだ足りないかも）":NG_MSG, it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); finish("答え"); }); }
      });
      card.appendChild(go);
    }
    card.appendChild(fb);
    if(r&&r.ok) finish(r.shown?"答え":OK_MSG);
    else if(r&&r.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); finish("答え"); });
    return card;
  }

  if(it.t==="fill"){
    card.appendChild(el("div","q",R(it.q)));
    const row=el("div","fillrow"); const box=el("div","abox"); box.tabIndex=0; box.setAttribute("role","textbox");
    const go=el("button","go","こたえる"); go.type="button"; go.style.marginTop="0";
    const fb=el("div","fb");
    let val = st.texts["in-"+it.id] || "";
    const answerShow = ()=> it.show ? R(it.show) : EXPR.pretty(it.ans);
    const paint=(active)=>{ box.innerHTML = (val? EXPR.pretty(val) : (active?"":`<span class="ph">タップして入力</span>`)) + (active?'<span class="cur"></span>':""); };
    const done=(shown)=>{ box.classList.add("done"); box.classList.remove("act"); box.innerHTML = shown ? answerShow() : EXPR.pretty(val); go.remove(); fbSet(fb,true, shown?"答え":OK_MSG); showWhy(card,it); if(kpTarget&&kpTarget.it===it) hideKP(); };
    const submit=()=>{
      if(!val){ fbSet(fb,false,"入力してから「こたえる」"); return; }
      if(!EXPR.valid(val)){ fbSet(fb,false,"式が読めない。かっこや記号を見直そう"); return; }
      const res=EXPR.same(val, it.ans, {x:!!it.x});
      const rr=mark(it.id, res.ok);
      if(res.ok) done(false);
      else { fbSet(fb,false,NG_MSG, it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); }); }
    };
    const api={it, get:()=>val, set:v=>{ val=v; st.texts["in-"+it.id]=v; save(); paint(true); }, submit, box, card, paint, keys:(it.keys!=null?it.keys:(cur.kp||"")) + (it.x?"x":"")};
    box.addEventListener("click",e=>{ e.stopPropagation(); if(!box.classList.contains("done")) showKP(api); });
    box.addEventListener("keydown",e=>{ if(box.classList.contains("done")) return; if(e.key==="Enter"){ e.preventDefault(); submit(); } else if(e.key==="Backspace"){ e.preventDefault(); api.set(val.slice(0,-1)); } else if(e.key.length===1 && /[0-9.+\-*/^()x√]/.test(e.key)){ e.preventDefault(); api.set(val+e.key); } });
    go.addEventListener("click",submit);
    row.append(box, go); card.append(row, fb);
    if(r&&r.ok) done(r.shown); else { paint(false); if(r&&r.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); }); }
    return card;
  }

  /* □ がいくつかある問題（頂点 (□, □)、平方完成、不等式の解 など） */
  if(it.t==="fills"){
    card.appendChild(el("div","q",R(it.q)));
    const row=el("div","fbox"); const fb=el("div","fb");
    const go=el("button","go","こたえる"); go.type="button";
    const blanks=[]; let finished=false;
    const submit=()=>{
      if(finished) return;
      if(blanks.some(b=>!b.val)){ fbSet(fb,false,"□ をぜんぶうめてから「こたえる」"); return; }
      if(blanks.some(b=>!EXPR.valid(b.val))){ fbSet(fb,false,"式が読めない □ がある。見直そう"); return; }
      const res=blanks.map(b=>EXPR.same(b.val, b.p.ans, {}).ok);
      const ok=res.every(x=>x);
      blanks.forEach((b,i)=>b.box.classList.toggle("ngbox", !res[i]));
      const rr=mark(it.id, ok);
      if(ok) done(false);
      else { const n=res.filter(x=>!x).length; fbSet(fb,false,`× ちがう。もう一度（赤い □ が ${n} つ）`, it.hint); if(rr.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); }); }
    };
    const done=(shown)=>{ finished=true; blanks.forEach(b=>{ b.box.classList.add("done"); b.box.classList.remove("act","ngbox"); b.box.innerHTML=EXPR.pretty(shown?b.p.ans:b.val); }); go.remove(); fbSet(fb,true, shown?"答え":OK_MSG); showWhy(card,it); if(kpTarget&&blanks.some(b=>b.api===kpTarget)) hideKP(); };
    it.parts.forEach((p,pi)=>{
      if(typeof p==="string"){ row.appendChild(el("span",null,R(p))); return; }
      const bi=blanks.length, key="in-"+it.id+"."+bi;
      const box=el("div","abox"); box.tabIndex=0; box.setAttribute("role","textbox"); box.setAttribute("aria-label",`□${bi+1}`);
      const b={p, box, val: st.texts[key]||""};
      const paint=(active)=>{ box.innerHTML=(b.val?EXPR.pretty(b.val):(active?"":`<span class="ph">□</span>`))+(active?'<span class="cur"></span>':""); };
      b.api={it, box, card, paint, submit, get:()=>b.val, set:v=>{ b.val=v; st.texts[key]=v; save(); box.classList.remove("ngbox"); paint(true); }, keys:(it.keys!=null?it.keys:(cur.kp||""))};
      box.addEventListener("click",e=>{ e.stopPropagation(); if(!finished) showKP(b.api); });
      box.addEventListener("keydown",e=>{ if(finished) return; if(e.key==="Enter"){ e.preventDefault(); submit(); } else if(e.key==="Backspace"){ e.preventDefault(); b.api.set(b.val.slice(0,-1)); } else if(e.key.length===1 && /[0-9.+\-*/^()x√]/.test(e.key)){ e.preventDefault(); b.api.set(b.val+e.key); } });
      paint(false); blanks.push(b); row.appendChild(box);
    });
    blanks.forEach((b,i)=>{ b.api.next = blanks[i+1] ? ()=>showKP(blanks[i+1].api) : null; });
    go.addEventListener("click",submit);
    card.append(row, go, fb);
    if(r&&r.ok) done(r.shown); else if(r&&r.tries>=2) revealBtn(card,it,()=>{ mark(it.id,true,true); done(true); });
    return card;
  }

  if(it.t==="cls"){
    card.appendChild(el("div","q",R(it.q)));
    const wrap=el("div","cls"); const fb=el("div","fb");
    const check=()=>{ if(it.rows.every((_,i)=>{ const rr=st.items[it.id+"."+i]; return rr&&rr.ok; })){ fbSet(fb,true,"○ ぜんぶ せいかい！"); showWhy(card,it); } };
    it.rows.forEach((rw,ri)=>{
      const key=it.id+"."+ri, rr0=st.items[key];
      const line=el("div","r"); const lab=el("div",null,R(rw[0])); const ops=el("div","opts");
      const fin=()=>{ ops.querySelectorAll(".opt").forEach((x,oi)=>{ x.disabled=true; x.classList.remove("wrong"); if(oi===rw[1]) x.classList.add("right"); }); };
      it.opts.forEach((o,oi)=>{ const b=el("button","opt",R(o)); b.type="button";
        b.addEventListener("click",()=>{ const ok=oi===rw[1]; const rr=mark(key,ok);
          ops.querySelectorAll(".opt").forEach(x=>x.classList.remove("wrong"));
          if(ok){ fin(); check(); } else { b.classList.add("wrong"); if(rr.tries>=2){ mark(key,true,true); fin(); fbSet(fb,false,"× まちがえた行は、答えを表示した"); helpRow(card,it); check(); } else fbSet(fb,false,NG_MSG); }
        }); ops.appendChild(b); });
      line.append(lab, ops); wrap.appendChild(line);
      if(rr0&&rr0.ok) fin();
    });
    card.append(wrap, fb); check(); return card;
  }

  if(it.t==="free"){
    card.appendChild(el("div","q",R(it.q)));
    const ta=el("textarea"); ta.value=st.texts[it.id]||""; ta.addEventListener("input",()=>{ st.texts[it.id]=ta.value; touch(); });
    card.appendChild(ta); return card;
  }
  return null;
}

/* ---------- 入力用キーパッド ---------- */
let kpEl=null, kpTarget=null;
function showKP(api){
  MEMO.hide(); MEMO.setFab(false);
  if(kpTarget && kpTarget!==api){ kpTarget.box.classList.remove("act"); kpTarget.paint(false); }
  kpTarget=api; api.box.classList.add("act"); api.paint(true);
  if(!kpEl){ kpEl=el("div","kp"); document.body.appendChild(kpEl); }
  const ex=api.keys;
  const has=c=>ex.includes(c), xs=has("x"), pr=xs||has("(");
  const K=[["7"],["8"],["9"],["/","op"],["^",xs?"op":"hide"],["⌫","fx cls2"],
           ["4"],["5"],["6"],["+",pr?"op":"hide"],["(",pr?"op":"hide"],[")",pr?"op":"hide"],
           ["1"],["2"],["3"],["−","op"],["x",xs?"op":"hide"],["√",has("√")?"op":"hide"],
           ["0"],["."],[api.next?"次の□":"",api.next?"fx nx":"hide"],["",'hide'],["こたえる","ent fx"]];
  kpEl.innerHTML=`<div class="in"><div class="kph"><span>${kpHelp(ex)}</span><button type="button" class="kpclose" data-k="close">とじる ✕</button></div><div class="keys">${K.map(k=>k[1]==="hide"?`<span class="kpgap"></span>`:`<button type="button" class="${k[1]||""}" data-k="${k[0]}">${k[0]==="x"?`<i>${k[0]}</i>`:k[0]}</button>`).join("")}</div></div>`;
  kpEl.querySelectorAll("button").forEach(b=>b.addEventListener("click",e=>{ e.stopPropagation(); const k=b.dataset.k, v=kpTarget.get();
    if(k==="⌫") kpTarget.set(v.slice(0,-1));
    else if(k==="close") hideKP();
    else if(k==="こたえる") kpTarget.submit();
    else if(k==="次の□"){ if(kpTarget.next) kpTarget.next(); }
    else kpTarget.set(v+(k==="−"?"-":k));
  }));
  kpEl.style.display="block";
  requestAnimationFrame(()=>{ const kh=kpEl.offsetHeight, rc=api.card.getBoundingClientRect(); const over=rc.bottom-(window.innerHeight-kh-8); if(over>0) window.scrollBy({top:over, behavior:"smooth"}); else if(rc.top<60) window.scrollBy({top:rc.top-70, behavior:"smooth"}); });
  document.querySelector(".wrap").style.paddingBottom="320px";
}
function kpHelp(ex){
  const t=["分数は 3/4","マイナスは −"];
  if(ex.includes("x")) t.push("x² は x ^ 2"); if(ex.includes("√")) t.push("2√3 は 2 √ 3");
  return t.join("　");
}
function hideKP(){
  if(kpTarget){ kpTarget.box.classList.remove("act"); if(!kpTarget.box.classList.contains("done")) kpTarget.paint(false); }
  kpTarget=null; if(kpEl) kpEl.style.display="none"; MEMO.setFab(true);
  const w=document.querySelector(".wrap"); if(w) w.style.paddingBottom="";
}
document.addEventListener("click",e=>{ if(!kpTarget) return; if(kpEl&&kpEl.contains(e.target)) return; if(kpTarget.card.contains(e.target)) return; hideKP(); });

}

      else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); a.style.opacity=".4"; warn.textContent="もくじにもどって、ニックネームを入れてから送ろう。"; } };
    a.addEventListener("pointerdown",upd); a.addEventListener("focus",upd);

function buildUrl(){
  const st=LS(cur.id), s=stats(cur);
  const texts=[]; cur.secs.forEach(sec=>sec.items.forEach(it=>{ if(it.t==="free"&&st.texts[it.id]) texts.push(st.texts[it.id]); }));
  const p={lesson:cur.no, nick:ST.nick, dev:ST.dev, done:s.done, total:s.total, first:s.first, shown:s.shown, tries:s.tries, minutes:s.minutes,
           rate:st.rate, learned:st.texts.learned||"", unclear:st.texts.unclear||"", texts:texts.join(" / "), ver:APP_VER, app:"nattoku1q"};
  return SUBMIT_URL+"?"+Object.entries(p).map(([k,x])=>k+"="+encodeURIComponent(String(x).slice(0,500))).join("&");
}
